<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidy Home</title>
<style>
:root{
  --bg:#18a9d6; --bg-grad:linear-gradient(160deg,#19d3c5 0%,#16b2e0 50%,#2f7ff0 100%);
  --on-bg:#ffffff; --on-bg-muted:rgba(255,255,255,.88);
  --card:#ffffff; --field:#f2f8fa; --text:#14262e; --muted:#5d7079; --line:#dbe8ec;
  --accent:#0a8ea3; --accent-ink:#ffffff; --accent-soft:#dcf5f7;
  --fab:#ff7657; --fab-ink:#ffffff;
  --warn:#d4462a; --warn-soft:#fde9e4;
  --shadow:0 2px 6px rgba(10,60,90,.12),0 6px 18px rgba(10,60,90,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d3a4f; --bg-grad:linear-gradient(160deg,#0b5560 0%,#0d3f60 55%,#14295a 100%);
    --on-bg:#f1fbfd; --on-bg-muted:rgba(241,251,253,.78);
    --card:#122a35; --field:#0c1f28; --text:#e9f4f7; --muted:#97b2bc; --line:#21414e;
    --accent:#4fd8e0; --accent-ink:#06232a; --accent-soft:#173e48;
    --fab:#ff8a6e; --fab-ink:#2a0c05;
    --warn:#ff9378; --warn-soft:#3a2420; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d3a4f; --bg-grad:linear-gradient(160deg,#0b5560 0%,#0d3f60 55%,#14295a 100%);
  --on-bg:#f1fbfd; --on-bg-muted:rgba(241,251,253,.78);
  --card:#122a35; --field:#0c1f28; --text:#e9f4f7; --muted:#97b2bc; --line:#21414e;
  --accent:#4fd8e0; --accent-ink:#06232a; --accent-soft:#173e48;
  --fab:#ff8a6e; --fab-ink:#2a0c05;
  --warn:#ff9378; --warn-soft:#3a2420; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
  min-height:100vh; color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:24px 0 8px}
header h1{margin:0;font-size:28px;letter-spacing:-.01em;color:var(--on-bg)}
header .date{color:var(--on-bg-muted);margin-top:2px}
.summary{margin:14px 0 4px;font-weight:700;color:var(--on-bg);font-size:18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--on-bg-muted);margin:22px 0 8px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;
}
.card.over{border-color:var(--warn)}
.check{
  flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
}
.check:active,.check:hover{background:var(--accent-soft)}
.check svg{width:18px;height:18px;opacity:.35;stroke:var(--accent)}
.info{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:14px;color:var(--muted)}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600}
.due.late{color:var(--warn);font-weight:600}
.empty{text-align:center;color:var(--on-bg);padding:36px 12px}
.empty p{margin:0 0 16px}
.btn{
  border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);min-height:46px;
}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hist{padding:10px 14px;min-height:0}
.filters{
  display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:none;border:0;border-radius:999px;padding:8px 15px;min-height:38px;cursor:pointer;
  font-size:14px;font-weight:600;background:rgba(255,255,255,.22);color:var(--on-bg);
}
.fchip[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.hist .tick{color:var(--accent);flex:none}

/* Add button */
.fab{
  position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:0;background:var(--fab);color:var(--fab-ink);
  font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
/* Bottom tabs */
nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav .wrap{display:flex}
nav button{
  flex:1;background:none;border:0;padding:12px 0 14px;cursor:pointer;color:var(--muted);
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav button[aria-selected="true"]{color:var(--accent)}

/* Add / edit sheet */
dialog{
  border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;
  background:var(--card);color:var(--text);
}
@media (min-width:600px){dialog{margin:auto;border-radius:18px}}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
dialog h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input,select{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);
  font-size:16px;min-height:46px;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}

/* Toast */
.toast{
  position:fixed;left:16px;right:16px;bottom:calc(152px + env(safe-area-inset-bottom));
  max-width:528px;margin:0 auto;background:var(--text);color:var(--card);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Today</h1>
    <div class="date" id="date"></div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" id="addBtn" aria-label="Add a task">+</button>

<nav>
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Today</button>
    <button role="tab" data-tab="upcoming" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Coming up</button>
    <button role="tab" data-tab="all" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>All tasks</button>
    <button role="tab" data-tab="history" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  </div>
</nav>

<dialog id="sheet">
  <form id="form" method="dialog">
    <h3 id="sheetTitle">Add a task</h3>
    <label for="fName">Task</label>
    <input id="fName" required maxlength="80" placeholder="e.g. Clean bathroom" autocomplete="off">
    <label for="fRoom">Room</label>
    <select id="fRoom"></select>
    <input id="fNewRoom" maxlength="40" placeholder="Type the new room name" autocomplete="off" style="display:none;margin-top:8px" aria-label="New room name">
    <label for="fEvery">How often</label>
    <select id="fEvery"></select>
    <label for="fDue">Next due</label>
    <input id="fDue" type="date" required>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Save</button>
    </div>
    <div class="actions" id="deleteRow">
      <button type="button" class="btn danger" id="deleteBtn">Delete task</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="undoBtn">Undo</button></div>

<script>
(function(){
  var KEY = 'tidyHome.v1';
  var FREQ = [[1,'Every day'],[3,'Every 3 days'],[7,'Every week'],[14,'Every 2 weeks'],[30,'Every month'],[90,'Every 3 months'],[0,'One time']];
  var ROOMS = ['Kitchen','Bathroom','Bedroom','Living room','Laundry','Closet','Garage','Whole house'];

  // ---------- saving ----------
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.tasks) && Array.isArray(s.history)) return s;
    }catch(e){}
    return {tasks:[], history:[]};
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  var state = load();
  if(!Array.isArray(state.rooms)) state.rooms = ROOMS.slice();
  var tab = 'today';
  try{ tab = localStorage.getItem(KEY+'.tab') || 'today'; }catch(e){}

  // ---------- dates ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return iso(new Date()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
  function daysFrom(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
  function dueLabel(due){
    var n = daysFrom(today(), due);
    if(n < 0) return {text: (-n)+(n===-1?' day':' days')+' overdue', late:true};
    if(n === 0) return {text:'Due today', late:false};
    if(n === 1) return {text:'Tomorrow', late:false};
    return {text:'In '+n+' days', late:false};
  }
  function dayName(s){
    var n = daysFrom(s, today());
    if(n === 0) return 'Today';
    if(n === 1) return 'Yesterday';
    return parse(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  function futureDayName(s){
    if(daysFrom(today(), s) === 1) return 'Tomorrow';
    return parse(s).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  }
  function freqName(n){ for(var i=0;i<FREQ.length;i++) if(FREQ[i][0]===n) return FREQ[i][1]; return 'Every '+n+' days'; }
  function byDue(a,b){ return a.due<b.due?-1:a.due>b.due?1:a.name.localeCompare(b.name); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // ---------- drawing ----------
  var main = document.getElementById('main');
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

  function taskCard(t, showFreq){
    var d = dueLabel(t.due);
    return '<div class="card'+(d.late?' over':'')+'">'+
      '<button class="check" data-done="'+t.id+'" aria-label="Mark '+esc(t.name)+' done">'+CHECK+'</button>'+
      '<button class="info" data-edit="'+t.id+'">'+
        '<div class="name">'+esc(t.name)+'</div>'+
        '<div class="meta">'+(t.room?'<span class="chip">'+esc(t.room)+'</span>':'')+
          '<span class="due'+(d.late?' late':'')+'">'+d.text+'</span>'+
          (showFreq?'<span>'+freqName(t.every)+'</span>':'')+
        '</div>'+
      '</button></div>';
  }

  var roomFilter = '';
  function roomsInUse(){
    var r = [];
    state.tasks.forEach(function(x){ var n = x.room || 'Other'; if(r.indexOf(n)<0) r.push(n); });
    return r.sort();
  }
  function inRoom(x){ return !roomFilter || (x.room || 'Other') === roomFilter; }
  function filterBar(){
    var rooms = roomsInUse();
    if(roomFilter && rooms.indexOf(roomFilter)<0) roomFilter = '';
    if(rooms.length < 2) return '';
    return '<div class="filters" role="group" aria-label="Show tasks for one room">'+
      [''].concat(rooms).map(function(r){
        return '<button class="fchip" data-room="'+esc(r)+'" aria-pressed="'+(r===roomFilter)+'">'+(r ? esc(r) : 'All rooms')+'</button>';
      }).join('')+'</div>';
  }

  function emptyStart(){
    return '<div class="empty"><p>No tasks yet.<br>Add your own, or start with a few common ones.</p>'+
      '<div class="row"><button class="btn" data-act="add">Add a task</button>'+
      '<button class="btn ghost" data-act="starter">Use starter tasks</button></div></div>';
  }

  function render(){
    document.getElementById('date').textContent =
      new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    var titles = {today:'Today', upcoming:'Coming up', all:'All tasks', history:'History'};
    if(!titles[tab]) tab = 'today';
    document.getElementById('title').textContent = titles[tab];
    document.querySelectorAll('nav button').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.tab===tab ? 'true':'false');
    });

    var t = today(), html = '';
    if(tab === 'today'){
      if(!state.tasks.length){ main.innerHTML = emptyStart(); return; }
      html += filterBar();
      var where = roomFilter ? ' in '+esc(roomFilter) : '';
      var due = state.tasks.filter(function(x){return x.due<=t && inRoom(x);}).sort(byDue);
      html += '<div class="summary">'+(due.length ? due.length+' to do'+where : "You're all caught up"+where+'!')+'</div>';
      if(due.length) html += '<div class="list">'+due.map(function(x){return taskCard(x);}).join('')+'</div>';
      else html += '<div class="empty"><p>Nothing due today.<br>Check the Coming up tab to get ahead.</p></div>';
    }
    else if(tab === 'upcoming'){
      if(!state.tasks.length){ main.innerHTML = emptyStart(); return; }
      html += filterBar();
      var later = state.tasks.filter(function(x){return x.due>t && inRoom(x);}).sort(byDue);
      if(!later.length) html += '<div class="empty"><p>Nothing scheduled after today'+(roomFilter ? ' in '+esc(roomFilter) : '')+'.</p></div>';
      var byDay = {}, dayOrder = [];
      later.forEach(function(x){ if(!byDay[x.due]){ byDay[x.due]=[]; dayOrder.push(x.due); } byDay[x.due].push(x); });
      dayOrder.forEach(function(d){
        html += '<h2>'+futureDayName(d)+'</h2><div class="list">'+byDay[d].map(function(x){return taskCard(x);}).join('')+'</div>';
      });
    }
    else if(tab === 'all'){
      if(!state.tasks.length){ main.innerHTML = emptyStart(); return; }
      var groups = {};
      state.tasks.forEach(function(x){ var r = x.room || 'Other'; (groups[r]=groups[r]||[]).push(x); });
      Object.keys(groups).sort().forEach(function(r){
        html += '<h2>'+esc(r)+'</h2><div class="list">'+groups[r].sort(byDue).map(function(x){return taskCard(x,true);}).join('')+'</div>';
      });
    }
    else {
      if(!state.history.length){ main.innerHTML = '<div class="empty"><p>Nothing finished yet.<br>Tap the circle next to a task to check it off.</p></div>'; return; }
      var days = {}, order = [];
      state.history.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).slice(0,200).forEach(function(h){
        if(!days[h.date]){ days[h.date]=[]; order.push(h.date); }
        days[h.date].push(h);
      });
      order.forEach(function(d){
        html += '<h2>'+dayName(d)+' · '+days[d].length+' done</h2><div class="list">'+
          days[d].map(function(h){
            return '<div class="card hist"><span class="tick">'+CHECK.replace('<svg','<svg width="20" height="20" stroke="currentColor"')+'</span>'+
              '<div class="info" style="cursor:default"><div class="name">'+esc(h.name)+'</div>'+
              (h.room?'<div class="meta"><span class="chip">'+esc(h.room)+'</span></div>':'')+'</div></div>';
          }).join('')+'</div>';
      });
    }
    main.innerHTML = html;
  }

  // ---------- actions ----------
  var undoSnap = null, toastTimer = null;
  function snapshot(){ undoSnap = JSON.stringify(state); }
  function toast(msg){
    document.getElementById('toastText').textContent = msg;
    var el = document.getElementById('toast');
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); undoSnap=null; }, 5000);
  }
  document.getElementById('undoBtn').onclick = function(){
    if(undoSnap){ state = JSON.parse(undoSnap); undoSnap=null; save(); render(); }
    document.getElementById('toast').classList.remove('show');
  };

  function markDone(id){
    var t = state.tasks.find(function(x){return x.id===id;});
    if(!t) return;
    snapshot();
    var d = today();
    state.history.push({id:uid(), taskId:t.id, name:t.name, room:t.room, date:d});
    if(t.every > 0){ t.last = d; t.due = addDays(d, t.every); }
    else state.tasks = state.tasks.filter(function(x){return x.id!==id;});
    save(); render();
    toast('Done: '+t.name+(t.every>0 ? ' · next '+dueLabel(t.due).text.toLowerCase() : ''));
  }

  function addStarter(){
    var t = today();
    var list = [
      ['Wipe kitchen counters','Kitchen',1,0], ['Take out trash','Whole house',3,0],
      ['Clean bathroom','Bathroom',7,1], ['Vacuum floors','Living room',7,2],
      ['Change bed sheets','Bedroom',7,3], ['Do laundry','Laundry',3,1],
      ['Dust surfaces','Living room',14,4], ['Clean out fridge','Kitchen',30,5],
      ['Declutter one drawer','Closet',30,6], ['Organize pantry','Kitchen',90,10]
    ];
    list.forEach(function(x){ state.tasks.push({id:uid(), name:x[0], room:x[1], every:x[2], due:addDays(t,x[3])}); });
    save(); render();
  }

  // ---------- add / edit sheet ----------
  var sheet = document.getElementById('sheet'), editingId = null;
  var fName=document.getElementById('fName'), fRoom=document.getElementById('fRoom'),
      fEvery=document.getElementById('fEvery'), fDue=document.getElementById('fDue'),
      fNewRoom=document.getElementById('fNewRoom');
  fRoom.addEventListener('change', function(){
    var isNew = fRoom.value === '__new__';
    fNewRoom.style.display = isNew ? '' : 'none';
    if(isNew) fNewRoom.focus();
  });
  fEvery.innerHTML = FREQ.map(function(f){return '<option value="'+f[0]+'">'+f[1]+'</option>';}).join('');

  function openSheet(id){
    editingId = id || null;
    var t = id ? state.tasks.find(function(x){return x.id===id;}) : null;
    var rooms = state.rooms.slice();
    state.tasks.forEach(function(x){ if(x.room && rooms.indexOf(x.room)<0) rooms.push(x.room); });
    fRoom.innerHTML = '<option value="">No room</option>' +
      rooms.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('') +
      '<option value="__new__">+ Add a new room…</option>';
    fNewRoom.value = ''; fNewRoom.style.display = 'none';
    document.getElementById('sheetTitle').textContent = t ? 'Edit task' : 'Add a task';
    document.getElementById('deleteRow').style.display = t ? '' : 'none';
    fName.value = t ? t.name : '';
    fRoom.value = t ? (t.room||'') : '';
    fEvery.value = String(t ? t.every : 7);
    fDue.value = t ? t.due : today();
    if(sheet.showModal) sheet.showModal(); else sheet.setAttribute('open','');
    if(!t) setTimeout(function(){ fName.focus(); }, 50);
  }
  function closeSheet(){ if(sheet.close) sheet.close(); else sheet.removeAttribute('open'); }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = fName.value.trim(); if(!name) return;
    var room = fRoom.value;
    if(room === '__new__'){
      room = fNewRoom.value.trim();
      var match = state.rooms.find(function(r){ return r.toLowerCase() === room.toLowerCase(); });
      if(match) room = match;
      else if(room) state.rooms.push(room);
    }
    var data = {name:name, room:room, every:+fEvery.value, due:fDue.value || today()};
    if(editingId){
      var t = state.tasks.find(function(x){return x.id===editingId;});
      if(t) Object.assign(t, data);
    } else {
      data.id = uid(); state.tasks.push(data);
    }
    save(); closeSheet(); render();
  });
  document.getElementById('cancelBtn').onclick = closeSheet;
  document.getElementById('deleteBtn').onclick = function(){
    var t = state.tasks.find(function(x){return x.id===editingId;});
    if(!t) return;
    snapshot();
    state.tasks = state.tasks.filter(function(x){return x.id!==editingId;});
    save(); closeSheet(); render(); toast('Deleted: '+t.name);
  };
  sheet.addEventListener('click', function(e){ if(e.target===sheet) closeSheet(); });

  // ---------- taps ----------
  main.addEventListener('click', function(e){
    var el = e.target.closest('[data-done],[data-edit],[data-act],[data-room]');
    if(!el) return;
    if(el.hasAttribute('data-room')){
      var keep = document.querySelector('.filters'), sx = keep ? keep.scrollLeft : 0;
      roomFilter = el.dataset.room; render();
      var f = document.querySelector('.filters');
      if(f){
        f.scrollLeft = sx;
        var on = f.querySelector('[aria-pressed="true"]');
        if(on && on.scrollIntoView) on.scrollIntoView({inline:'nearest', block:'nearest'});
      }
    }
    else if(el.dataset.done) markDone(el.dataset.done);
    else if(el.dataset.edit) openSheet(el.dataset.edit);
    else if(el.dataset.act==='add') openSheet();
    else if(el.dataset.act==='starter') addStarter();
  });
  document.getElementById('addBtn').onclick = function(){ openSheet(); };
  document.querySelectorAll('nav button').forEach(function(b){
    b.onclick = function(){
      tab = b.dataset.tab;
      try{ localStorage.setItem(KEY+'.tab', tab); }catch(e){}
      render(); window.scrollTo(0,0);
    };
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });

  render();
})();
</script>
</body>
</html>
